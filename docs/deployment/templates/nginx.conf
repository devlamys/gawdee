# Render __DOMAIN__, __ENV__, __FRONTEND_PORT__, __ADMIN_IP__ before installing.
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 30m;

    # Initially restrict access until first-admin setup is complete.
    allow __ADMIN_IP__;
    deny all;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
    }

    location /assets/uploads/ {
        alias /srv/gawdee/__ENV__/shared/public/assets/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        if (-f /srv/gawdee/__ENV__/shared/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
