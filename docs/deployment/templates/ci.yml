name: CI
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Reject tracked credentials and databases
        run: python docs/deployment/scripts/check-tracked.py
      - name: Prepare isolated test environment
        run: python docs/deployment/scripts/prepare-ci.py
      - name: Backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Backend regression tests (no live gateway calls)
        working-directory: backend
        run: |
          python -m unittest test_admin_auth test_loyalty_routes -v
          python test_payments.py
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit --incremental false
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend build
        working-directory: frontend
        env:
          BACKEND_ORIGIN: http://127.0.0.1:9
          INTERNAL_API_URL: http://127.0.0.1:9/api
          NEXT_PUBLIC_API_URL: /api
        run: npm run build
